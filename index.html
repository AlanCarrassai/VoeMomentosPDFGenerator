<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="jspdf.umd.min.js"></script>
    <script src="airports.js"></script>
    <script src="script.js" defer></script>

  <div style="display:none">
    <img id="logo-voemomentos" src="logos/voemomentos.png">
    <img id="logo-gol"         src="logos/gol.png">
    <img id="logo-azul"        src="logos/azul.png">
    <img id="logo-latam"       src="logos/latam.png">
  </div>

  <script>
    function imgToBase64(imgEl) {
      try {
        const canvas = document.createElement('canvas');
        canvas.width  = imgEl.naturalWidth  || imgEl.width;
        canvas.height = imgEl.naturalHeight || imgEl.height;
        canvas.getContext('2d').drawImage(imgEl, 0, 0);
        return canvas.toDataURL('image/png');
      } catch(e) { return null; }
    }

    window.logos = {};
    window.addEventListener('load', () => {
      window.logos.voemomentos = imgToBase64(document.getElementById('logo-voemomentos'));
      window.logos.gol         = imgToBase64(document.getElementById('logo-gol'));
      window.logos.azul        = imgToBase64(document.getElementById('logo-azul'));
      window.logos.latam       = imgToBase64(document.getElementById('logo-latam'));
    });
  </script>
    <title>VoeMomentos PDF</title>
</head>
<body>
<div class="container">
  <header>
    <h1>✈ VoeMomentos PDF</h1>
    <p>Preencha os dados abaixo para gerar o voucher do voo</p>
  </header>

  <form id="pdfForm">

    <!-- CIA AÉREA -->
    <div class="card">
      <h2>Companhia Aérea</h2>
      <div class="form-grid full">
        <div class="field">
          <label for="cia_aerea">CIA Aérea</label>
          <select id="cia_aerea" required>
            <option value="">Selecione uma opção</option>
            <option value="Gol">Gol</option>
            <option value="Azul">Azul</option>
            <option value="Latam">Latam</option>
            <option value="">Outra</option>
          </select>
        </div>
      </div>
    </div>

    <!-- VOO IDA (gerado via JS) -->
    <div class="card" id="card-voo-ida"></div>

    <!-- VOO INTERNO -->
    <div class="card">
      <h2>Voo — Interno</h2>
      <div id="voo-container"></div>
      <button type="button" class="btn-add" onclick="adicionarVooInterno()">+ Adicionar voo interno</button>
    </div>

    <!-- VOO VOLTA (gerado via JS) -->
    <div class="card" id="card-voo-volta"></div>

    <!-- BAGAGEM -->
    <div class="card">
      <h2>Bagagem</h2>
      <div id="bagagens-container"></div>
      <button type="button" class="btn-add" onclick="adicionarBagagem()">+ Adicionar bagagem</button>
    </div>

    <!-- VALORES -->
    <div class="card">
      <h2>Valores da Passagem</h2>
      <div class="form-grid">
        <div class="field span2">
          <label for="valor_passagem_pix">Valor Pix (R$)</label>
          <input type="number" id="valor_passagem_pix" min="0" placeholder="0,00">
        </div>
        <div class="field">
          <label for="valor_passagem_parcelado">Valor Parcelado (R$)</label>
          <input type="number" id="valor_passagem_parcelado" min="0" placeholder="0,00">
        </div>
        <div class="field">
          <label for="qtd_parcelas">Qtd. Parcelas</label>
          <input type="number" id="qtd_parcelas" min="1" value="1">
        </div>
      </div>
    </div>

    <!-- OBSERVAÇÕES -->
    <div class="card">
      <h2>Observações</h2>
      <div class="form-grid full">
        <div class="field">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" placeholder="Informações adicionais sobre o voo..."></textarea>
        </div>
      </div>
    </div>

    <button type="submit">Gerar PDF ↓</button>
  </form>
</div>

<script>
  // ─────────────────────────────────────────────────────────────────
  // FÁBRICA DE SEÇÃO DE VOO
  // Gera o HTML interno de qualquer seção de voo a partir de um config.
  //
  // config = {
  //   prefixo     : string   — prefixo único dos IDs (ex: "ida", "volta", "interno_2")
  //   titulo      : string   — título do card (ex: "Voo — Ida")
  //   origemPH    : string   — placeholder do campo Origem
  //   destinoPH   : string   — placeholder do campo Destino
  //   numeroPH    : string   — placeholder do número do voo
  //   removerFn   : string|null — nome da função JS de remoção (somente voos internos)
  //   removerArg  : any      — argumento passado para removerFn
  // }
  // ─────────────────────────────────────────────────────────────────
  function criarCamposVoo(config) {
    const p = config.prefixo;
    const removerBtn = config.removerFn
      ? `<button type="button" class="btn-remove"
           onclick="${config.removerFn}(${config.removerArg})">Remover</button>`
      : '';

    const escalaBloco = config.semEscala ? '' : `
      <div id="subvoos_${p}"></div>
      <button type="button" class="btn-add"
              onclick="adicionarSubVoo('${p}')">+ Adicionar escala</button>
    `;

    return `
      <div class="voo-header">
        <span class="voo-label">${config.titulo}</span>
        ${removerBtn}
      </div>
      <div class="form-grid">
        <div class="field">
          <label for="origem_${p}">Origem</label>
          <input type="text" id="origem_${p}" autocomplete="off"
                 placeholder="${config.origemPH || 'Ex: São Paulo (GRU)'}" required>
        </div>
        <div class="field">
          <label for="destino_${p}">Destino</label>
          <input type="text" id="destino_${p}" autocomplete="off"
                 placeholder="${config.destinoPH || 'Ex: Rio de Janeiro (GIG)'}" required>
        </div>
        <div class="field">
          <label for="data_${p}">Data</label>
          <input type="date" id="data_${p}" required>
        </div>
        <div class="field">
          <label for="hora_embarque_${p}">Hora de Embarque</label>
          <input type="time" id="hora_embarque_${p}" required>
        </div>
        <div class="field">
          <label for="numero_voo_${p}">Número do Voo</label>
          <input type="text" id="numero_voo_${p}"
                 placeholder="${config.numeroPH || 'Ex: G3 1234'}" required>
        </div>
        <div class="field">
          <label for="hora_chegada_${p}">Hora de Chegada</label>
          <input type="time" id="hora_chegada_${p}" required>
        </div>
        <div class="field">
          <label for="qtd_pessoas_${p}">Qtd. de Pessoas</label>
          <input type="number" id="qtd_pessoas_${p}" min="1" value="1" required>
        </div>
      </div>
      ${escalaBloco}
    `;
  }

  const _subVooCounters = {};

  function adicionarSubVoo(prefixoPai) {
    _subVooCounters[prefixoPai] = (_subVooCounters[prefixoPai] || 0) + 1;
    const n         = _subVooCounters[prefixoPai];
    const p         = prefixoPai + '_escala_' + n;
    const container = document.getElementById('subvoos_' + prefixoPai);

    const div = document.createElement('div');
    div.className = 'subvoo-item';
    div.id        = 'subvoo-item-' + p;
    div.innerHTML = criarCamposVoo({
      prefixo    : p,
      titulo     : 'Escala ' + n,
      semEscala  : true,
      removerFn  : 'removerSubVoo',
      removerArg : `'${p}','${prefixoPai}'`,
    });

    container.appendChild(div);

    if (typeof initAirportAutocomplete === 'function') {
      initAirportAutocomplete('origem_' + p);
      initAirportAutocomplete('destino_' + p);
    }

    atualizarNumeracaoSubVoos(prefixoPai);
  }

  function removerSubVoo(prefixo, prefixoPai) {
    const el = document.getElementById('subvoo-item-' + prefixo);
    if (el) el.remove();
    atualizarNumeracaoSubVoos(prefixoPai);
  }

  function atualizarNumeracaoSubVoos(prefixoPai) {
    const container = document.getElementById('subvoos_' + prefixoPai);
    if (!container) return;
    container.querySelectorAll(':scope > .subvoo-item .voo-label').forEach((label, i) => {
      label.textContent = 'Escala ' + (i + 1);
    });
  }

  // ─── Renderiza Ida e Volta no carregamento ────────────────────────
  document.getElementById('card-voo-ida').innerHTML =
    '<h2>Voo — Ida</h2>' +
    criarCamposVoo({
      prefixo   : 'ida',
      titulo    : 'Voo — Ida',
      origemPH  : 'Ex: São Paulo (GRU)',
      destinoPH : 'Ex: Rio de Janeiro (GIG)',
    });

  document.getElementById('card-voo-volta').innerHTML =
    '<h2>Voo — Volta</h2>' +
    criarCamposVoo({
      prefixo   : 'volta',
      titulo    : 'Voo — Volta',
      origemPH  : 'Ex: Rio de Janeiro (GIG)',
      destinoPH : 'Ex: São Paulo (GRU)',
    });

  // ─── Voos internos dinâmicos ──────────────────────────────────────
  let vooInternoCounter = 0;

  function adicionarVooInterno() {
    vooInternoCounter++;
    const id        = vooInternoCounter;
    const container = document.getElementById('voo-container');

    const div = document.createElement('div');
    div.className = 'voo_interno-item';
    div.id        = 'voo_interno-item-' + id;
    div.innerHTML = criarCamposVoo({
      prefixo    : 'interno_' + id,
      titulo     : 'Voo interno ' + id,  // atualizado por atualizarNumeracaoVooInterno()
      removerFn  : 'removerVooInterno',
      removerArg : id,
    });

    container.appendChild(div);

    // autocomplete de aeroportos nos campos recém-criados
    if (typeof initAirportAutocomplete === 'function') {
      initAirportAutocomplete('origem_interno_' + id);
      initAirportAutocomplete('destino_interno_' + id);
    }

    atualizarNumeracaoVooInterno();
  }

  function removerVooInterno(id) {
    const el = document.getElementById('voo_interno-item-' + id);
    if (el) el.remove();
    atualizarNumeracaoVooInterno();
  }

  function atualizarNumeracaoVooInterno() {
    document.querySelectorAll('.voo_interno-item .voo-label').forEach((label, i) => {
      label.textContent = 'Voo interno ' + (i + 1);
    });
  }

  // ─── Bagagens dinâmicas ───────────────────────────────────────────
  let bagagemCounter = 0;

  function adicionarBagagem() {
    bagagemCounter++;
    const id        = bagagemCounter;
    const container = document.getElementById('bagagens-container');

    const div = document.createElement('div');
    div.className = 'bagagem-item';
    div.id        = 'bagagem-item-' + id;
    div.innerHTML = `
      <div class="bagagem-header">
        <span class="bagagem-label">Bagagem 1</span>
        <button type="button" class="btn-remove" onclick="removerBagagem(${id})">Remover</button>
      </div>
      <div class="form-grid">
        <div class="field">
          <label>Tipo</label>
          <select id="bagagem_tipo_${id}" required>
            <option value="">Selecione</option>
            <option value="Mochila/Bolsa">Mochila/Bolsa</option>
            <option value="Bagagem de Mão">Bagagem de Mão</option>
            <option value="Bagagem Despachada">Bagagem Despachada</option>
          </select>
        </div>
        <div class="field">
          <label>Quantidade</label>
          <input type="number" id="bagagem_qtd_${id}" min="0" value="1" required>
        </div>
        <div class="field span2">
          <label>Valor (R$)</label>
          <input type="number" id="bagagem_valor_${id}" min="0" placeholder="0,00">
        </div>
      </div>
    `;
    container.appendChild(div);
    atualizarNumeracao();
  }

  function removerBagagem(id) {
    const el = document.getElementById('bagagem-item-' + id);
    if (el) el.remove();
    atualizarNumeracao();
  }

  function atualizarNumeracao() {
    document.querySelectorAll('.bagagem-item .bagagem-label').forEach((label, i) => {
      label.textContent = 'Bagagem ' + (i + 1);
    });
  }

  // Inicia com uma bagagem
  adicionarBagagem();
</script>
</body>
</html>
